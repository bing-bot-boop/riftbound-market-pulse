name: Update public Riftbound sources
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-data.yml'
permissions:
  contents: write
concurrency:
  group: riftbound-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - name: Collect and validate source data
        run: python scripts/refresh_sources.py
      - name: Refresh Pokémon snapshots once per day
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          try:
              checked = datetime.fromisoformat(json.loads(Path("data/pokemon.json").read_text())["checkedAt"])
              due = not Path("data/pokemon-catalogue.json").exists() or (datetime.now(timezone.utc) - checked).total_seconds() > 86400
          except (OSError, ValueError, KeyError):
              due = True
          if due:
              subprocess.run(["python", "scripts/refresh_pokemon.py"], check=True)
          PY
      - name: Save refreshed public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public card and tournament sources'
            git pull --rebase origin main
            git push origin main
          fi
